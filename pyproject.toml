[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alottacake-commerce-ops-agent"
version = "1.0.0"
description = "Bounded multi-agent Google ADK Commerce Operations & Edge Reconciliation Agent for Alotta Cake (Shopify + Cloudflare)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alejandro Palumbo" }
]
dependencies = [
  "google-adk>=1.0.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "python-json-logger>=2.0.7",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-dlp>=3.18.0",
  "aiosqlite>=0.20.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["commerce_ops_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

